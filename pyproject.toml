[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transquant-w"
version = "0.2.0"
description = "Compute the TransQuant probe weight factor (W) for an smFISH probe library."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
app = ["streamlit"]
dev = ["pytest", "streamlit"]

[project.scripts]
transquant-w = "transquant_w.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
